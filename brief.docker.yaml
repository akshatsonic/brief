publication:
  name: The Brief
  timezone: UTC
  schedule: "0 7 * * *"
  max_articles: 20
sources:
  - id: hackernews
    name: Hacker News
    type: rss
    url: https://news.ycombinator.com/rss
    category: technology
editorial:
  deduplicate: true
  max_age_hours: 36
  categories: []
output: {format: pdf, theme: magazine, directory: /output}
llm: {enabled: true, backend: codex-api, model: gpt-6-astra, api_key_env: OPENAI_API_KEY}
database: {path: /data/brief.db}
delivery: {provider: local}
