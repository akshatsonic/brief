<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"><head><title>{{ category|title }}</title></head>
<body class="section-page">
  <p class="edition-label">Section</p>
  <h1>{{ category|title }}</h1>
  <ol class="article-list">{% for article in articles %}<li><a href="{{ article_hrefs[article.id] }}">{{ article.title }}</a>
  {% if article.summary %}<p>{{ article.summary }}</p>{% elif article.author %}<p>{{ article.author }}</p>{% endif %}</li>{% endfor %}</ol>
</body></html>
